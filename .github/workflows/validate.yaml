#==============================================================================
# GITHUB RUNNER STACK VALIDATION WORKFLOW
#==============================================================================

name: 01 - Validate Runner Automation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

#==============================================================================
# VALIDATION JOB
#==============================================================================

jobs:
  validate:
    name: 01 - Validate Runner Stack
    runs-on: ubuntu-latest
    steps:
      - name: 01 - Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: 02 - Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh

      - name: 03 - Validate Runner Stack
        run: bash scripts/validate.sh

      - name: 04 - Check Upstream Versions
        run: bash scripts/check-latest-versions.sh

      - name: 05 - Build Runner Image
        env:
          GITHUB_TARGET: owner/repository
        run: docker compose build
