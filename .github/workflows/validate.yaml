#==============================================================================
# GITHUB RUNNER STACK VALIDATION WORKFLOW
#==============================================================================

name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

#==============================================================================
# VALIDATION JOB
#==============================================================================

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh

      - name: Validate runner stack
        run: bash scripts/validate.sh

      - name: Check latest upstream versions
        run: bash scripts/check-latest-versions.sh

      - name: Build runner image
        env:
          GITHUB_TARGET: owner/repository
        run: docker compose build
