#==============================================================================
# LOW RESOURCE GITHUB ACTIONS RUNNERS
#==============================================================================

#==============================================================================
# STACK IDENTITY
#==============================================================================

name: github-runner

#==============================================================================
# RUNNER SERVICES
#==============================================================================

services:
  #============================================================================
  # DEPLOY RUNNER - MUTATING PIPELINES ONLY
  #============================================================================

  runner-deploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-runner:${GITHUB_RUNNER_VERSION:-2.337.0}

    #==========================================================================
    # DEPLOY RUNNER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M

    #==========================================================================
    # DEPLOY RUNNER RUNTIME ENVIRONMENT
    #==========================================================================

    environment:
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_SCOPE: ${GITHUB_SCOPE:-repo}
      GITHUB_TARGET: ${GITHUB_TARGET:?GITHUB_TARGET is required}
      HOME: /home/runner
      RUNNER_LABELS: ${RUNNER_ORGANISATION_LABEL:-bharathcloudops},${RUNNER_LOCATION_LABEL:-oci-platform},deploy
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-bharathcloudops-oci-platform}-deploy-${RUNNER_DEPLOY_SEQUENCE:-01}

    restart: unless-stopped
    secrets:
      - github_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-deploy-workspace:/home/runner/_work

  #============================================================================
  # VALIDATE RUNNER - NON-MUTATING CHECKS ONLY
  #============================================================================

  runner-validate:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-runner:${GITHUB_RUNNER_VERSION:-2.337.0}

    #==========================================================================
    # VALIDATE RUNNER RESOURCE LIMITS
    #==========================================================================

    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 512M

    #==========================================================================
    # VALIDATE RUNNER RUNTIME ENVIRONMENT
    #==========================================================================

    environment:
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_SCOPE: ${GITHUB_SCOPE:-repo}
      GITHUB_TARGET: ${GITHUB_TARGET:?GITHUB_TARGET is required}
      HOME: /home/runner
      RUNNER_LABELS: ${RUNNER_ORGANISATION_LABEL:-bharathcloudops},${RUNNER_LOCATION_LABEL:-oci-platform},validate
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-bharathcloudops-oci-platform}-validate-${RUNNER_VALIDATE_SEQUENCE:-01}

    restart: unless-stopped
    secrets:
      - github_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-validate-workspace:/home/runner/_work

  #============================================================================
  # PRIVATE RUNNER METRICS EXPORTER
  #============================================================================

  runner-metrics:
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/github-runner-metrics
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: 32M
    ports:
      - ${GITHUB_RUNNER_BIND_ADDRESS:-127.0.0.1}:9101:9100
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave

  #==============================================================================
  # RUNNER SECRETS
  #==============================================================================

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-./secrets/github-token}

#==============================================================================
# RUNNER PERSISTENT VOLUMES
#==============================================================================

volumes:
  runner-deploy-workspace:
  runner-validate-workspace:
